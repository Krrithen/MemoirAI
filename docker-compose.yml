services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: memoir
      POSTGRES_PASSWORD: memoir
      POSTGRES_DB: memoir
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoir"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
