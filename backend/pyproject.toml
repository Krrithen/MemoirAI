[project]
name = "memoir-ai-backend"
version = "0.1.0"
description = "Local-first personal memory engine: API and model pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.6",
    "httpx==0.28.1",
    "faster-whisper==1.2.1",
]

[project.optional-dependencies]
# Only needed for TRANSCRIBER=assemblyai or LLM=gemini
hosted = [
    "assemblyai==1.6.1",
    "google-genai==2.25.0",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI declares params with File(...)/Path(...) defaults by design
ignore = ["B008"]
